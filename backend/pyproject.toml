[project]
name = "market-cockpit"
version = "1.0.0"
description = "Macro-aware market monitoring, signal engines and swing-trade picks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "apscheduler>=3.10,<4",
  "pandas>=2.1",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "httpx>=0.27",
  "feedparser>=6.0",
  "vaderSentiment>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cockpit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
